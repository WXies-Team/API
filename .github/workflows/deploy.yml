name: deploy

# push main 自动部署；workflow 自身/文档改动不触发（避免 Dependabot 升级 actions 后白跑部署）
# workflow_dispatch 为手动入口，不受 paths 限制，可随时强制部署
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# 同分支并发只保留最后一次（对应旧 deploy.sh 锁文件的防重入）
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      # 纯 PHP 无构建步骤（沿用原 deploy.sh：只同步文件）
      # 直接覆盖：--delete 使服务器目录与仓库逐字一致
      # .git / node_modules 不上传也不删；.user.ini / .well-known 为 aaPanel 面板托管
      # .git/.github/.gitignore/.gitattributes/HANDOFF.md 为 git 专用，不同步也不留
      # （.user.ini 可能被 chattr 锁定，删它会以 rsync code 23 失败），同样保留
      # .cache 为运行时缓存（自愈重建），保留在服务器不参与覆盖
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          DIR: ${{ secrets.SERVER_API_DIR }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/deploy_key"
          KNOWN="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          trap 'rm -f "$KEY"' EXIT
          SSH_OPTS=(-i "$KEY" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$KNOWN" -o BatchMode=yes)
          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "mkdir -p '$DIR' && rm -rf $DIR/.git $DIR/.github $DIR/.gitignore $DIR/.gitattributes $DIR/HANDOFF.md"
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' --exclude='.gitattributes' \
            --exclude='HANDOFF.md' --exclude='node_modules' --exclude='.user.ini' --exclude='.well-known' --exclude='.cache' \
            -e "ssh ${SSH_OPTS[*]}" \
            "$GITHUB_WORKSPACE/" "$USER@$HOST:$DIR/"
